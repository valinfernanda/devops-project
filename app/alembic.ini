# Alembic = database migration tool for SQLAlchemy.
# The database URL is NOT stored here; migrations/env.py reads APP_DATABASE_URL.
[alembic]
script_location = migrations
# Add the current folder (/app) to Python's import path so env.py can "import taskapi".
# Without it: ModuleNotFoundError: No module named 'taskapi'
prepend_sys_path = .
