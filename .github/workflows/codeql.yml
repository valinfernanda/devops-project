# =============================================================================
# CodeQL: GitHub's static application security testing (SAST).
# It reads the source code (without running it) and looks for vulnerable
# patterns: SQL injection, path traversal, unsafe deserialization, and also
# insecure GitHub Actions workflows. Free for public repositories.
# Findings appear under the repo's Security → Code scanning tab.
# =============================================================================
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # every Monday 03:27 UTC: new CodeQL rules can find issues in old code

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions] # our app code + our workflow files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none # interpreted languages: nothing to compile

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
