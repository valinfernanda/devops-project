# =============================================================================
# Dependabot: GitHub's bot that opens pull requests when a dependency has a new
# version. Each PR then goes through the full CI pipeline before you merge it,
# so updates are automatic, but never untested.
# =============================================================================
version: 2
updates:
  # Python packages: requirements.in / requirements.txt (pip-compile format)
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python-dependencies: # one PR for all Python updates instead of one PR each
        patterns: ["*"]

  # Base image digests in app/Dockerfile (FROM python:3.13-slim@sha256:...)
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  # Actions in .github/workflows (updates the pinned commit SHAs + version comments)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
