{{- /*
PodDisruptionBudget: limits VOLUNTARY disruptions (node drain for maintenance/upgrades,
cluster autoscaler). `kubectl drain` waits instead of evicting a pod if that would leave
fewer than minAvailable API pods. It does NOT protect against crashes or node failures.
*/ -}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "taskapi.fullname" . }}
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "taskapi.selectorLabels" . | nindent 6 }}
{{- end }}
