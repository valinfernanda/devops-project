{{- /*
The database password. Created ONLY when no existingSecret is given.

Problem: randAlphaNum would make a NEW password on every "helm upgrade", while the
database (on its disk) keeps the OLD one → the app could no longer log in.
Solution: "lookup" asks the cluster for the Secret first and reuses its value if it exists.
"resource-policy: keep" → `helm uninstall` leaves the Secret (and the database disk keeps its
data), so a reinstall still matches the password stored inside the database.
*/ -}}
{{- if not .Values.database.existingSecret }}
{{- $name := include "taskapi.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
