apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskapi.fullname" . }}
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "taskapi.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
