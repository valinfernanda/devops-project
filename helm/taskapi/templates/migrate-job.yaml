{{- /*
Migrations as a Helm HOOK: Helm runs this Job at a specific moment of install/upgrade.
  post-install → on the FIRST install, after the Secret and database exist
  pre-upgrade  → on every upgrade, BEFORE the new app version rolls out
                 (the new code expects the new schema)
"before-hook-creation" deletes the previous Job right before creating the new one, so the
last run stays visible for `kubectl logs` (and Job's "can't change a Job" problem disappears).
Env vars are written inline (not from the ConfigMap): in pre-upgrade the ConfigMap is still
the OLD version.
*/ -}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taskapi.fullname" . }}-migrate
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\"; do echo waiting for db; sleep 2; done"]
          env:
            - name: DB_HOST
              value: {{ include "taskapi.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
          securityContext:
            runAsUser: 70
            {{- include "taskapi.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: migrate
          image: {{ include "taskapi.image" . }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "taskapi.dbEnv" . | nindent 12 }}
          securityContext:
            runAsUser: 10001
            readOnlyRootFilesystem: true
            {{- include "taskapi.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
{{- end }}
