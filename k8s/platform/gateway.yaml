# =============================================================================
# PLATFORM layer (owned by DevOps): the cluster's front door, shared by all apps.
# Requires Envoy Gateway (installed with Helm, see Step 3.7):
#   helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.10.0 \
#     -n envoy-gateway-system --create-namespace --wait
#
# Gateway API, in 3 roles:
#   GatewayClass  → "which software implements gateways"   (cluster admin)
#   Gateway       → "a front door: which ports/hostnames"   (platform/DevOps)
#   HTTPRoute     → "send /path on host X to my Service"    (app team; see k8s/manifests/50-httproute.yaml)
# =============================================================================
---
# How Envoy Gateway should create its proxy on THIS cluster.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # On a cloud (AKS) we'd keep the default "LoadBalancer" and get a public IP.
        # kind has no cloud load balancer, so we use a NodePort...
        type: NodePort
        # ...and "Cluster": a request arriving on ANY node is forwarded to the Envoy pod,
        # wherever it runs. The default "Local" only serves pods on the SAME node, and our
        # traffic enters through the control-plane node, where no Envoy pod runs → timeouts.
        externalTrafficPolicy: Cluster
        # Fix the NodePort to 30080: kind-cluster.yaml maps laptop 127.0.0.1:8090 → node:30080.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Which namespaces may attach routes to this door. Only namespaces that carry the
      # label below (the app team asks DevOps to add it). Safer than "All".
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
