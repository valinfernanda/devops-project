# The Task API: a Deployment (keeps N identical pods running, rolls out new versions)
# + a Service (one stable name/IP in front of those pods, load-balances between them).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
  namespace: taskapi
  labels:
    app.kubernetes.io/name: taskapi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taskapi
spec:
  replicas: 2                          # two copies: one can die/restart while the other serves
  revisionHistoryLimit: 5              # keep 5 old versions for "kubectl rollout undo"
  selector:
    matchLabels:                       # which pods belong to this Deployment (must match the template)
      app.kubernetes.io/name: taskapi
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                      # during an update: at most 1 EXTRA pod...
      maxUnavailable: 0                # ...and never fewer ready pods than "replicas" → zero downtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskapi
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: taskapi
    spec:
      terminationGracePeriodSeconds: 30   # time between SIGTERM and SIGKILL on shutdown
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                 # the "app" user created in our Dockerfile
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Spread the replicas over different nodes: if one node dies, the other copy survives.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: taskapi
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/valinfernanda/taskapi:sha-2273a31   # immutable tag = exact commit on main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: taskapi-config }
          env:
            - name: APP_VERSION
              value: "sha-2273a31"
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: taskapi-db, key: password } }
            - name: APP_DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)"
          # --- The three probes (Phase 1 built /health and /ready for exactly this) ---
          # startupProbe: give the app time to boot; the other probes wait until it passes.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30           # up to 60 s to start
          # livenessProbe: "is the process stuck?" → fails 3x → kubelet RESTARTS the container.
          # Must NOT check the database (Phase 1, Step 1.3).
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readinessProbe: "may I get traffic?" → fails → pod removed from the Service (no restart).
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the app can't modify its own files (Dockerfile made them root-owned)
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp              # the one writable place, in case a library needs temp files
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: taskapi
  namespace: taskapi
  labels:
    app.kubernetes.io/name: taskapi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taskapi
spec:
  type: ClusterIP                  # reachable only INSIDE the cluster; Step 3.7 exposes it to your laptop
  selector:
    app.kubernetes.io/name: taskapi
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80                     # other pods call http://taskapi (port 80)...
      targetPort: http             # ...forwarded to the container's port named "http" (8000)
