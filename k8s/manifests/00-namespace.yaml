# A Namespace is a "folder" inside the cluster: everything of the Task API lives here,
# separated from system components (kube-system) and from other apps.
#
# The pod-security labels switch on Kubernetes' built-in Pod Security Admission at the
# strictest level ("restricted"): the API server REJECTS any pod in this namespace that
# runs as root, can escalate privileges, keeps Linux capabilities, etc.
apiVersion: v1
kind: Namespace
metadata:
  name: taskapi
  labels:
    pod-security.kubernetes.io/enforce: restricted   # reject non-compliant pods
    pod-security.kubernetes.io/warn: restricted      # print a warning in kubectl output too
    gateway-access: "true"                           # may attach HTTPRoutes to the shared Gateway (Step 3.7)
