# PostgreSQL inside the cluster: a headless Service + a StatefulSet with its own disk.
#
# Why a StatefulSet and not a Deployment?
#   - stable name: the pod is always "postgres-0" (a Deployment gives random names)
#   - its own PersistentVolumeClaim per pod (volumeClaimTemplates), re-attached after restarts
#   - ordered start/stop
# In real production you would usually use a managed database (Azure Database for
# PostgreSQL, Phase 8) or an operator (CloudNativePG). Running it here teaches the concepts.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskapi
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskapi
spec:
  clusterIP: None            # "headless": DNS points straight at the pod, no load balancing needed
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taskapi
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskapi
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: taskapi
    spec:
      # Pod-level security (required by the namespace's "restricted" policy).
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # the "postgres" user inside the postgres:*-alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine          # same image as compose.yaml
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: taskapi-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: taskapi-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: taskapi-db, key: password } }
            # Keep the data in a SUBFOLDER of the volume (initdb wants an empty folder).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Ready = accepts connections. Until then the Service sends it no traffic.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }   # what the scheduler reserves
            limits:   { memory: 512Mi }              # hard cap: above this the container is killed (OOMKilled)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
  # One PersistentVolumeClaim per pod, created automatically: "data-postgres-0".
  # kind's default StorageClass ("standard", local-path) creates a folder on the node for it.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
